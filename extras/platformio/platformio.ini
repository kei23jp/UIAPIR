; Every UIAPIR sketch, buildable from VS Code with the PlatformIO extension.
;
; One environment per sketch. The sketches stay ordinary Arduino sketches that
; arduino-cli and the Arduino IDE build exactly as before; this project only
; gives PlatformIO a way in, through the one-line files in src/. README.md
; explains why the obvious layout cannot work.
;
;   pio run                          build every sketch
;   pio run -e Receive               build one
;   pio run -e Receive -t upload     hold RST while plugging the board in first
;   pio device monitor -e HT5_ReceiveDump
;
; In VS Code, open UIAPIR.code-workspace and pick the project and the
; environment from the PlatformIO status bar.
;
; HT6 is not here. It is two firmwares that have to agree with each other, so
; it is its own project: extras/hardware-tests/HT6_TwoBoard.

[env]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git
board = UIAPduino_Pro_Micro_CH32V003_v1dot4
framework = arduino

; Matches what arduino-cli builds the library and its examples with.
build_flags =
    -Os
    -std=gnu++14
    -Wall
    -Wextra

; UIAPIR itself, two directories up. A symlink dependency builds the working
; tree rather than a copy, so editing the library and re-running pio picks the
; change up.
lib_deps = symlink://../..

monitor_speed = 115200

; UIAPduino is flashed over USB by its own bootloader, not through a WCH-Link
; SWD probe: hold RST while plugging the board in, then upload. The bootloader
; enumerates as a HID device, 1209:b803 - no libusb driver to install, but also
; not something stock minichlink can talk to.
;
; That matters, because `upload_protocol = minichlink` uses the copy PlatformIO
; ships, which is upstream ch32v003fun. Its programmer list is
; "b003boot, ardulink, esp32s2chfun, funprog, isp" - no b803boot - so it probes
; 1209:b003, finds nothing and reports:
;
;   VID:0x1209, PID:0xb003
;   Error: Could not initialize any supported programmers
;
; The minichlink inside the UIAP Arduino package is a fork that adds a
; b803boot backend, and is what the Arduino IDE uses. Call that one, with the
; command from the package's own platform.txt, plus `-b`.
;
; `-b` matters more than it looks: without it the board stays in the
; bootloader after a successful flash and never starts the firmware, so a
; sketch that prints at boot prints nothing until someone presses reset.
;
; The path carries the tool's pinned version, so a UIAP core update can move
; it; the current one is under %LOCALAPPDATA%\Arduino15\packages\UIAP\tools.
upload_protocol = custom
upload_command = "${sysenv.LOCALAPPDATA}/Arduino15/packages/UIAP/tools/minichlink-2982dfd/1.0.0/minichlink.exe" -w $BUILD_DIR/firmware.bin flash -b

; --------------------------------------------------------------- examples ---

[env:Receive]
build_src_filter = -<*> +<Receive.cpp>

[env:SendProtocols]
build_src_filter = -<*> +<SendProtocols.cpp>

[env:SendRaw]
build_src_filter = -<*> +<SendRaw.cpp>

[env:LearnAndReplay]
build_src_filter = -<*> +<LearnAndReplay.cpp>

[env:LearnRemote]
build_src_filter = -<*> +<LearnRemote.cpp>

[env:TwoBoardLinkSender]
build_src_filter = -<*> +<TwoBoardLink.cpp>
build_flags = ${env.build_flags} -DUIAPIR_LINK_ENDPOINT=0

[env:TwoBoardLinkReceiver]
build_src_filter = -<*> +<TwoBoardLink.cpp>
build_flags = ${env.build_flags} -DUIAPIR_LINK_ENDPOINT=1

; --------------------------------------------------------- hardware tests ---
; What to wire up and what to expect: extras/HARDWARE_TESTS.md.

[env:HT1_BeginContract]
build_src_filter = -<*> +<HT1_BeginContract.cpp>

[env:HT2_PinRebinding]
build_src_filter = -<*> +<HT2_PinRebinding.cpp>

[env:HT3_TimerOwnership]
build_src_filter = -<*> +<HT3_TimerOwnership.cpp>

[env:HT4_TransmitTiming]
build_src_filter = -<*> +<HT4_TransmitTiming.cpp>

[env:HT5_ReceiveDump]
build_src_filter = -<*> +<HT5_ReceiveDump.cpp>
